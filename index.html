
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardener's Atlas</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container" id="environment" data-environment="e0001">

<div class="atlas-about">

       

        

    </div>

   
<div class="top-icons">

    <!-- Home icon -->
    <a href="index.html" class="home-icon" aria-label="Home">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 10.5 L12 3 L21 10.5 M5.5 9.5 V21 H18.5 V9.5 M9.5 21 V14 H14.5 V21"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="1.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"/>
        </svg>
    </a>

    <!-- Sound icon -->
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Sound off">
        <svg class="sound-icon" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M3 9 V15 H7 L12 20 V4 L7 9 Z"
                  fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linejoin="round"/>
            <path class="sound-waves" d="M16 9 Q20 12 16 15 M18 6 Q24 12 18 18"
                  fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
            <path class="sound-cross" d="M16 9 L21 15 M21 9 L16 15"
                  fill="none" stroke="currentColor" stroke-width="1.6"
                  stroke-linecap="round"/>
        </svg>
    </button>

    <!-- Information icon -->
    <button id="about-toggle" type="button" aria-expanded="false" aria-label="Information">
        <svg viewBox="0 0 24 24" aria-hidden="true">
            <circle cx="12" cy="12" r="9"
                    fill="none" stroke="currentColor" stroke-width="1.5"/>
            <path d="M12 11 V17 M12 7 V8"
                  fill="none" stroke="currentColor" stroke-width="1.7"
                  stroke-linecap="round"/>
        </svg>
    </button>

</div>


        <div class="image-stage">

        <img
             id="environment-image"
             src=""
             alt=""
             class="main-image"
        >

       <div id="layer-container"></div>

      

    <div id="about-text" hidden>
    Disclaimer: Personal Protective Equipment should be worn when machinery is in operation.
    No lone working.
    Plant deliveries should first be quarantined for a minimum of 3 weeks.
</div>




</div>



      
<div class="wooden-menu">

    <div id="phone-container"></div>

</div>




        <audio id="environment-audio" loop preload="none"></audio>


    </main>

    <script src="environments.js"></script>
    <script src="script.js"></script>

</body>
</html>
